appId: com.khalidw.Mansory
productName: Mansory
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!**/node_modules/**/@img/*musl*/**'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - "**/node_modules/sqlite-vec-*/**"
  - "**/node_modules/@img/**"
  - "**/node_modules/sharp/**"
win:
  executableName: mansory
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Mansory
  executableName: mansory
  syncDesktopName: true
  category: Utility
flatpak:
  runtime: org.freedesktop.Platform
  runtimeVersion: '24.08'
  sdk: org.freedesktop.Sdk
  base: org.electronjs.Electron2.BaseApp
  baseVersion: '24.08'
  files:
    - - build/flatpak-icons/512.png
      - /share/icons/hicolor/512x512/apps/com.khalidw.Mansory.png
    - - build/flatpak-icons/256.png
      - /share/icons/hicolor/256x256/apps/com.khalidw.Mansory.png
    - - build/flatpak-icons/128.png
      - /share/icons/hicolor/128x128/apps/com.khalidw.Mansory.png
    - - build/flatpak-icons/64.png
      - /share/icons/hicolor/64x64/apps/com.khalidw.Mansory.png
    - - build/flatpak-icons/48.png
      - /share/icons/hicolor/48x48/apps/com.khalidw.Mansory.png
  finishArgs:
    - --socket=wayland
    - --socket=x11
    - --share=ipc
    - --device=dri
    - --share=network
    - --filesystem=home
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
